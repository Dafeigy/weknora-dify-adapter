services:
  weknora-dify-adapter:
    build: .
    image: weknora-dify-adapter
    restart: unless-stopped
    environment:
      WEKNORA_BASE_URL: ${WEKNORA_BASE_URL}
      WEKNORA_API_KEY: ${WEKNORA_API_KEY}
      WEKNORA_CHAT_API_KEY: ${WEKNORA_CHAT_API_KEY:-}
      WEKNORA_AGENT_ID: ${WEKNORA_AGENT_ID:-}
      WEKNORA_KNOWLEDGE_BASE_IDS: ${WEKNORA_KNOWLEDGE_BASE_IDS:-}
      DIFY_ADAPTER_API_KEY: ${DIFY_ADAPTER_API_KEY}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
      DIFY_CONVERSATION_DB_PATH: /data/conversations.sqlite3
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    ports:
      - "${ADAPTER_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - adapter_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  adapter_data:

